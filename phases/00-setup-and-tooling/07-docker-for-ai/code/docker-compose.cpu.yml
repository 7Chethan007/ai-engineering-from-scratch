# CPU-only compose variant of this lesson's docker-compose.yml for Apple Silicon Macs.
# See phases/00-setup-and-tooling/07-docker-for-ai/docs/en.md (Exercise 2, "No GPU?").
# Differs from docker-compose.yml: uses Dockerfile.cpu, no NVIDIA deploy block,
# arm64 qdrant image.
services:
  ai-dev:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    volumes:
      - ../../../:/workspace
      - ~/models:/models
      - ~/datasets:/data
    ports:
      - "8888:8888"
    stdin_open: true
    tty: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
